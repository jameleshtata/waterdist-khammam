<!doctype html>
<html lang="en" data-theme="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos | Khammam</title>
<meta name="description" content="Brand adverts and product videos for bottled water in Khammam.">
<meta property="og:type" content="website">
<meta property="og:title" content="Videos | Water supply in Khammam">
<meta property="og:description" content="Brand adverts and product videos for bottled water in Khammam.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Telugu:wght@400;500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<div id="chrome-top"></div>
<div id="banner" class="hidden"></div>
<div id="err"></div>

<main class="wrap">
  <section class="intro rise">
    <h1 data-i18n="vid.h1"></h1>
    <p data-i18n="vid.sub"></p>
  </section>

  <div class="vids" id="vids" style="margin-top:20px"></div>
  <div id="noVids" class="empty hidden" data-i18n="vid.none"></div>

  <ul class="linklist" id="official" style="display:none">
    <li><a id="officialA" href="#" target="_blank" rel="noopener"><div><b id="officialT"></b><span data-i18n="vid.official"></span></div><svg viewBox="0 0 24 24"><path d="M9 6 L15 12 L9 18"></path></svg></a></li>
  </ul>
</main>

<div id="foot"></div>

<script src="app.js?v=9"></script>
<script>
App.start('videos', function () {
  var box = document.getElementById('vids');
  var ok = 0;

  App.vids.forEach(function (v) {
    var id = App.ytId(v.url);
    if (!id) return;
    ok++;
    var card = App.el('div', 'vid');
    var fr = App.el('div', 'vid-frame');
    var img = new Image();
    img.alt = ''; img.loading = 'lazy';
    img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    fr.appendChild(img);
    var title = App.el('div', 'vid-title');
    if (v.title) { title.textContent = App.clean(v.title); }
    else { title.setAttribute('data-i18n', 'vid.watch'); }
    var btn = App.el('button', 'vid-play'); btn.type = 'button';
    btn.setAttribute('data-i18n-aria', 'vid.play');
    btn.innerHTML = '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#FFFFFF"></circle><path d="M26 20 L46 32 L26 44 Z" fill="#065961"></path></svg>';
    btn.onclick = function () {
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0';
      f.title = title.textContent;
      f.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture';
      f.allowFullscreen = true;
      fr.textContent = '';
      fr.appendChild(f);
    };
    fr.appendChild(btn);
    card.appendChild(fr);
    card.appendChild(title);
    var yt = App.el('a', 'vid-yt');
    yt.setAttribute('data-i18n', 'vid.yt');
    yt.href = 'https://www.youtube.com/watch?v=' + id;
    yt.target = '_blank'; yt.rel = 'noopener';
    card.appendChild(yt);
    box.appendChild(card);
    if (!v.title) {
      fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id) + '&format=json')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (j && j.title) { title.removeAttribute('data-i18n'); title.textContent = App.clean(j.title); }
        })
        .catch(function () {});
    }
  });
  if (!ok) document.getElementById('noVids').classList.remove('hidden');

  var ol = App.cfg.officialLink || {};
  if (ol.url && /^https:\/\//.test(ol.url)) {
    document.getElementById('officialA').href = ol.url;
    document.getElementById('officialT').textContent = App.pick(ol.label) || 'Official product page';
    document.getElementById('official').style.display = 'block';
  }
  App.rerender = function () {
    document.getElementById('officialT').textContent = App.pick(ol.label) || 'Official product page';
  };
  App.applyI18n();
});
</script>
</body>
</html>
